# SPDX-License-Identifier: Apache-2.0
# Shared configuration for every device on the Qualcomm SM8550 (Snapdragon 8 Gen 2) family.
# A device on this SoC sets `soc = "qcom/sm8550"` and only declares what differs.
schema = 1
vendor = "qcom"
family = "sm8550"
name = "Qualcomm Snapdragon 8 Gen 2 (SM8550)"
arch = "aarch64"
part_numbers = ["SM8550"]

[kernel]
repository = "https://github.com/SimplyLuma/linux"
branch = "sm8550"
upstream = "https://github.com/ianchb/sm8550-mainline"
dts_directory = "arch/arm64/boot/dts/qcom"

[boot]
# Android bootloader (ABL) defaults for this family. Devices may override.
format = "android-boot-v2"
page_size = 4096
slots = "ab"
dtb_in_boot_image = true

[boot.offsets]
base = 0x00000000
kernel = 0x00008000
ramdisk = 0x01000000
second = 0x00000000
tags = 0x01e00000
dtb = 0x01f00000

[firmware]
# Device firmware lives under this path on the device, never in git.
directory = "qcom/sm8550"

